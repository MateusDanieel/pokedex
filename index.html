<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frontend Test | Pokédex</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./public/css/main.css">
</head>
<body>
    <header class="sec-header">
      <div class="container">
        <img src="./assets/img/logo.png" alt="Pokémon Logo" class="sec-header__logo" />
      </div>
    </header>
    
    <main>
      <section class="sec-pokemon-list">
        <div class="container">
          <input type="search" class="sec-pokemon-list__search" placeholder="Pesquisar por nome..." autofocus />

          <div class="sec-pokemon-list__content"></div>
        </div>
      </section>
    </main>

    <div class="pokemon-modal" hidden>
      <div class="pokemon-modal__overlay"></div>
      <button
  class="pokemon-modal__arrow pokemon-modal__arrow--prev"
  type="button"
  aria-label="Pokémon anterior"
>
  ‹
</button>
      <div class="pokemon-modal__content">
        <button class="pokemon-modal__close" type="button">
          &times;
        </button>

        <div class="pokemon-modal__body"></div>
      </div>

      <button
  class="pokemon-modal__arrow pokemon-modal__arrow--next"
  type="button"
  aria-label="Próximo Pokémon"
>
  ›
</button>
    </div>

    <script type="module" src="./src/js/main.js"></script>
</body>
</html>
